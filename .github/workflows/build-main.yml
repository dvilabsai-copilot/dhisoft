name: Build And Deploy On Main

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: dhisoft-production
      cancel-in-progress: false

    steps:
      - name: Deploy to DigitalOcean over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 139.59.73.162
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -e
            git -c safe.directory=/var/www/dhisoft -C /var/www/dhisoft fetch origin main
            git -c safe.directory=/var/www/dhisoft -C /var/www/dhisoft show '${{ github.sha }}:ops/deploy.sh' > '/tmp/dhisoft-deploy-${{ github.sha }}.sh'
            bash '/tmp/dhisoft-deploy-${{ github.sha }}.sh' '${{ github.sha }}'
